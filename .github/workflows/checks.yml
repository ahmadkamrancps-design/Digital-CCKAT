name: Foundation checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: cck_test
          POSTGRES_USER: cck
          POSTGRES_PASSWORD: ci_only_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cck -d cck_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.lock
      - run: pip install -r requirements-dev.lock && pip install --no-deps -e .
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app
      - name: Check operational tooling
        working-directory: .
        run: |
          ruff check ops --config backend/pyproject.toml
          ruff format --check ops --config backend/pyproject.toml
      - run: |
          if [ ! -x /usr/lib/postgresql/17/bin/pg_dump ]; then
            . /etc/os-release
            sudo install -d /usr/share/postgresql-common/pgdg
            sudo curl --fail --silent --show-error --retry 3 --max-time 60 \
              https://www.postgresql.org/media/keys/ACCC4CF8.asc \
              -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
            echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
              | sudo tee /etc/apt/sources.list.d/pgdg.list
            sudo apt-get update
            sudo apt-get install -y postgresql-client-17
          fi
      - run: pytest -q
      - run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://cck:ci_only_password@localhost:5432/cck_test
          PG_CLIENT_BIN: /usr/lib/postgresql/17/bin
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
  railway-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build Railway runtime
        run: docker build -f Dockerfile.railway -t cck-railway-check .
      - name: Verify assigned port, frontend and API boundaries
        run: |
          docker run --detach --name cck-railway-check \
            --publish 127.0.0.1:5180:9000 \
            --env PORT=9000 --env ENVIRONMENT=production \
            --env DATABASE_URL=postgresql://ci:ci_only_password@unconfigured-db/ci \
            --env SESSION_COOKIE_SECURE=true \
            --env FRONTEND_ORIGIN=https://cck.example \
            --env 'ALLOWED_HOSTS=["localhost","healthcheck.railway.app"]' \
            cck-railway-check
          python3 - <<'PY'
          import gzip
          import re
          import time
          import urllib.error
          import urllib.request

          def request(path, headers=None):
              try:
                  req = urllib.request.Request('http://localhost:5180' + path, headers=headers or {})
                  return urllib.request.urlopen(req, timeout=3)
              except urllib.error.HTTPError as response:
                  return response

          for attempt in range(30):
              try:
                  if request('/api/health').status == 200:
                      break
              except (OSError, urllib.error.URLError):
                  pass
              time.sleep(1)
          else:
              raise RuntimeError('Railway image did not start on its assigned PORT')

          for path, status in [('/', 200), ('/admin/questions', 200), ('/api/me', 401),
                               ('/api/admin/questions', 401), ('/api/missing', 404),
                               ('/.env', 404), ('/preview/admin', 404),
                               ('/api/local-management', 404)]:
              with request(path) as response:
                  assert response.status == status, (path, response.status)
                  assert response.headers['X-Frame-Options'] == 'DENY'
                  assert "default-src 'self'" in response.headers['Content-Security-Policy']
                  assert response.headers['Cache-Control'] == 'no-store'

          with request('/') as response:
              html = response.read().decode()
          script = re.search(r'src="([^"]+\.js)"', html).group(1)
          stylesheet = re.search(r'href="([^"]+\.css)"', html).group(1)
          for path in (script, stylesheet):
              with request(path, {'Accept-Encoding': 'gzip'}) as response:
                  assert response.headers['Content-Encoding'] == 'gzip'
                  assert 'immutable' in response.headers['Cache-Control']
                  decoded = gzip.decompress(response.read()).decode()
                  if path == stylesheet:
                      css = decoded
          assert 'fonts.googleapis.com' not in css
          urls = [url.strip("\"'") for url in re.findall(r'url\(([^)]+)\)', css)]
          for extension, mime in (('.webp', 'image/webp'), ('.woff2', 'font/woff2')):
              path = next(url for url in urls if url.endswith(extension))
              with request(path, {'Accept-Encoding': 'gzip', 'Range': 'bytes=0-1023'}) as response:
                  assert response.headers['Content-Type'] == mime
                  assert response.headers.get('Content-Encoding') is None
                  assert 'immutable' in response.headers['Cache-Control']
          print('Railway image smoke checks passed')
          PY
      - name: Runtime diagnostics
        if: failure()
        run: docker logs cck-railway-check
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: python -m pip install pip-audit==2.10.1
      - run: pip-audit -r backend/requirements-dev.lock --disable-pip --no-deps
      - run: npm audit --prefix frontend
  production-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: bash ops/rehearsal_compose.sh
